[project]
name = "screen_vision"
version = "0.1.0"
description = "Gives Astra sight: captures the screen and answers questions about what is visible, using any OpenAI-compatible vision model."
requires-python = ">=3.10"
dependencies = [
    "astra-plugin-sdk>=0.6,<0.7",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# `pip install -e ".[dev]"`, then `pytest`. The harness itself ships in the SDK,
# so this extra adds the runner and nothing else.
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
